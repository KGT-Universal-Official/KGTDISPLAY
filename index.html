<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGT RemoteControl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚡ KGT RemoteControl</h1>
        <p class="subtitle">Zero-Lag City-to-City Remote Display & Control</p>

        <!-- Role Selection Screen -->
        <div id="role-selection" class="card">
            <h3>Select Operation Mode:</h3>
            <button onclick="selectRole('sender')" class="btn">💻 Code for another screen</button>
            <button onclick="selectRole('receiver')" class="btn">📱 Connect Remote Screen</button>
        </div>

        <!-- Host / Sender Screen (PC) -->
        <div id="sender-box" class="card hidden">
            <h3>Your Secure Alphanumeric Code:</h3>
            <div id="generated-pin" class="pin-display">GENERATING...</div>
            <p id="connection-status" style="font-size: 0.85rem; color: var(--neon-blue);">Status: Connecting to network server...</p>
        </div>

        <!-- Receiver Screen (Phone/Tablet) -->
        <div id="receiver-box" class="card hidden">
            <h3>Enter Remote Host Code:</h3>
            <div id="error-message" class="error-banner hidden"></div>
            <input type="text" id="input-pin" placeholder="e.g. KGT8M2" maxlength="6" style="text-transform: uppercase;">
            <button onclick="connectToRemotePC()" class="btn">Establish Connection</button>
        </div>
    </div>

    <!-- Active Stream Viewport -->
    <div id="stream-container" class="hidden">
        <video id="remote-video" autoplay playsinline></video>
        <div class="control-overlay-bar" id="overlay-bar">
            <span>🔴 LIVE CONTROL ACTIVE</span>
            <button onclick="disconnectStream()" class="exit-btn">Disconnect</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
